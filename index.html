<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kelime Kartı</title>
    <meta name="description" content="Aralıklı tekrarla İngilizce kelime öğrenme" />
    <link rel="icon" type="image/png" href="./favicon-64.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kelime Kartı" />
    <meta name="theme-color" content="#f4f5fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1020" media="(prefers-color-scheme: dark)" />
    <script>
      // Tema ilk boyamadan önce uygulanır (bkz. src/theme.ts).
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          var c = t === 'dark' ? '#0f1020' : '#f4f5fb';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = c; });
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
